[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pagedserve"
version = "0.1.0"
description = "An experimental LLM inference runtime demonstrating block-based KV caching, continuous batching, chunked prefill, and prefix caching."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Sarthak Verma", email = "sarthakverma0802@gmail.com"}
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.24.0",
    "psutil>=5.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "pyright>=1.1.350",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # Line length formatting
    "E702",   # Multiple statements on one line (used in compact test vector setups)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "RUF059", "B017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
