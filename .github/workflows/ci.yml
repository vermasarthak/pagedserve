name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers ruff pytest pytest-asyncio httpx fastapi uvicorn psutil numpy pydantic

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Run Pytest Test Suite
        run: |
          pytest -v
